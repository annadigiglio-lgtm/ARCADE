      - es_btnSalva:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            Fill: =nfAccento
            Font: =nfFont
            Height: =44
            HoverColor: =Color.White
            HoverFill: =ColorFade(nfAccento, -10%)
            OnSelect: |-
              =If(
                  IsBlank(es_txtRag.Text), Notify("La ragione sociale è obbligatoria", NotificationType.Error),
                  !IsMatch(es_txtPiva.Text, "\d{11}"), Notify("La partita IVA deve avere esattamente 11 cifre", NotificationType.Error),
                  IfError(
                      If(locNuovo,
                          Patch(Espositori, Defaults(Espositori), {'ID espositore': "ESP" & Text(Value(Right(First(Sort(Espositori, 'ID espositore', SortOrder.Descending)).'ID espositore', 3)) + 1, "000"), 'Ragione sociale': es_txtRag.Text, 'Partita IVA': es_txtPiva.Text, Settore: es_txtSett.Text, Città: es_txtCitta.Text, Referente: es_txtRef.Text, 'Email referente': es_txtMail.Text}),
                          Patch(Espositori, es_galEsp.Selected, {'Ragione sociale': es_txtRag.Text, 'Partita IVA': es_txtPiva.Text, Settore: es_txtSett.Text, Città: es_txtCitta.Text, Referente: es_txtRef.Text, 'Email referente': es_txtMail.Text})
                      );
                      Notify("Espositore salvato", NotificationType.Success);
                      UpdateContext({locNuovo: false}),
                      Notify("Salvataggio non riuscito: " & FirstError.Message, NotificationType.Error)
                  )
              )
            PressedFill: =ColorFade(nfAccento, -20%)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =12
            Text: ="Salva"
            X: =808
            Y: =688
