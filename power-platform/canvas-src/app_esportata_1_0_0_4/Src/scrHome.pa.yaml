      - hm_btnAggiorna:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =nfAccento
            Fill: =nfAccentoChiaro
            Font: =nfFont
            HoverColor: =nfAccento
            HoverFill: =ColorFade(nfAccentoChiaro, -10%)
            OnSelect: |-
              =Refresh(Contratti); Refresh(Stand);
              ClearCollect(colContratti, AddColumns(Contratti,
