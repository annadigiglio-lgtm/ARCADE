                  Height: =10
                  Width: =370
                  Y: =58
            - hm_recPFg:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Elemento grafico"
                  Fill: =nfAccento
                  Height: =10
                  Width: =(Parent.TemplateWidth) * CountRows(Filter(colContratti, AnnoEd = gblAnno && Left(CodStand, 2) = ThisItem.Codice && StatoTxt <> "annullato")) / Max(1, CountRows(Filter(colStand, CodPad = ThisItem.Codice && AnnoAtt <= Value(gblAnno))))
