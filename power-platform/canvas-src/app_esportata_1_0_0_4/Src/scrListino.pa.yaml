            Font: =nfFont
            Height: =36
            Size: =10
            Text: ="Prezzo e disponibilità devono essere numeri positivi (decimali con la virgola)"
            Visible: =!((IsBlank(ls_txtPrezzo.Text) || (IsNumeric(ls_txtPrezzo.Text) && Value(ls_txtPrezzo.Text) >= 0)) && (IsBlank(ls_txtDisp.Text) || (IsNumeric(ls_txtDisp.Text) && Value(ls_txtDisp.Text) >= 0)))
            Width: =390
            X: =928
            Y: =472
      - ls_lblInfo:
