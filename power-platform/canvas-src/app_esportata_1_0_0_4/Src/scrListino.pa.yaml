      - ls_galListino:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
          Properties:
            AccessibleLabel: ="Voci di listino"
            Height: =598
            Items: =Sort(Filter(colListino, locCat = "Tutte" || (locCat = "Spazio" && StartsWith(Codice, "SPAZIO")) || (locCat = "Maggiorazioni" && StartsWith(Codice, "MAGG")) || (locCat = "Servizi" && StartsWith(Codice, "EX-")) || (locCat = "Sponsor" && StartsWith(Codice, "SP-")) || (locCat = "Condizioni" && StartsWith(Codice, "COND"))), Codice)
            OnSelect: |-
              =UpdateContext({locConfL: false})
            TabIndex: =0
            TemplatePadding: =0
            TemplateSize: =58
            Width: =638
            X: =249
            Y: =153
          Children:
            - ls_recRiga:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Elemento grafico"
                  Fill: =If(ThisItem.IsSelected, nfAccentoChiaro, nfCard)
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
            - ls_lblCod:
                Control: Label@2.5.1
                Properties:
                  Color: =nfTesto
                  FocusedBorderThickness: =2
                  Font: =nfFont
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: =ThisItem.Codice
                  Width: =260
                  X: =16
                  Y: =6
            - ls_lblDesc:
                Control: Label@2.5.1
                Properties:
                  Color: =nfTestoSec
                  FocusedBorderThickness: =2
                  Font: =nfFont
                  Height: =20
                  Size: =10
                  Text: =ThisItem.Descrizione
                  Width: =380
                  X: =16
                  Y: =30
            - ls_lblPrezzo:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =nfTesto
                  FocusedBorderThickness: =2
                  Font: =nfFont
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: =If(IsBlank(ThisItem.'Prezzo unitario'), "-", Text(ThisItem.'Prezzo unitario', "#,##0.00") & " " & Coalesce(ThisItem.Unità, ""))
                  Width: =210
                  X: =400
                  Y: =6
            - ls_lblDisp:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =nfTestoSec
                  FocusedBorderThickness: =2
                  Font: =nfFont
                  Height: =20
                  Size: =10
                  Text: |-
                    =If(IsBlank(ThisItem.Disponibilità), "disponibilità illimitata", "disponibili: " & ThisItem.Disponibilità)
                  Width: =210
                  X: =400
                  Y: =30
            - ls_recRigaSep:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Elemento grafico"
                  Fill: =nfBordo
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
