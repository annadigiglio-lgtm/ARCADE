            Size: =10
            Text: |-
              ="Il nuovo prezzo vale per i prossimi preventivi. I contratti già creati restano invariati: ogni riga conserva il prezzo con cui è stata venduta."
            Width: =390
            X: =928
            Y: =520
      - ls_btnSalva:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            DisabledColor: =nfTestoSec
            DisabledFill: =nfBordo
            DisplayMode: =If((IsBlank(ls_txtPrezzo.Text) || (IsNumeric(ls_txtPrezzo.Text) && Value(ls_txtPrezzo.Text) >= 0)) && (IsBlank(ls_txtDisp.Text) || (IsNumeric(ls_txtDisp.Text) && Value(ls_txtDisp.Text) >= 0)), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =If(locConfL, nfRosso, nfAccento)
            Font: =nfFont
            HoverColor: =Color.White
            HoverFill: =ColorFade(If(locConfL, nfRosso, nfAccento), -10%)
            OnSelect: |-
              =If(locConfL,
                  IfError(
                      Patch('Voci listino', LookUp('Voci listino', Codice = ls_galListino.Selected.Codice),
                          {'Prezzo unitario': If(IsBlank(ls_txtPrezzo.Text), Blank(), Value(ls_txtPrezzo.Text)),
                            Disponibilità: If(IsBlank(ls_txtDisp.Text), Blank(), Value(ls_txtDisp.Text)),
                            Note: ls_txtNote.Text});
                      UpdateContext({locConfL: false});
                      Notify("Voce di listino aggiornata", NotificationType.Success);
                      ClearCollect(colListino, 'Voci listino');
