                  Color: =nfTestoSec
                  FocusedBorderThickness: =2
                  Font: =nfFont
                  Height: =20
                  Size: =10
                  Text: =Text(ThisItem.'Metri quadri') & " m² · " & ThisItem.PosTxt
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =36
            - st_lblStato:
                Control: Label@2.5.1
                Properties:
                  Color: =If(IsBlank(LookUp(colContratti, AnnoEd = gblAnno && CodStand = ThisItem.'Codice stand' && StatoTxt <> "annullato")), nfVerde, nfRosso)
