                      & ", con scadenza " & Text(If(acc, ct_galContratti.Selected.'Scadenza acconto', ct_galContratti.Selected.'Scadenza saldo'), "dd/mm/yyyy") & "."
                      & Char(10) & Char(10) & "Cordiali saluti," & Char(10) & "Ufficio commerciale ARCADE Milano")))
            Fill: =nfAccentoChiaro
