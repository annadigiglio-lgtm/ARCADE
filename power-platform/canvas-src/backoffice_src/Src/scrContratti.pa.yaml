              =ColorFade(If(locConf, nfRosso, nfCard), -10%)
            PressedFill: |-
              =ColorFade(If(locConf, nfRosso, nfCard), -20%)
            HoverColor: |-
              =If(locConf, Color.White, nfRosso)
            BorderThickness: =1
            Font: =nfFont
            Size: =12
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            DisabledFill: =nfBordo
            DisabledColor: =nfTestoSec
            BorderColor: =nfRosso
