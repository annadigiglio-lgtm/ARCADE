            DisabledColor: =nfTestoSec
            DisplayMode: |-
              =If(ct_galContratti.Selected.StatoTxt = "firmato" && ((IsBlank(ct_galContratti.Selected.'Acconto pagato il') && ct_galContratti.Selected.'Scadenza acconto' < Today()) || (IsBlank(ct_galContratti.Selected.'Saldo pagato il') && ct_galContratti.Selected.'Scadenza saldo' < Today())), DisplayMode.Edit, DisplayMode.Disabled)
