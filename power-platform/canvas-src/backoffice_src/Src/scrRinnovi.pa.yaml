    Properties:
      Fill: =nfSfondo
      OnVisible: |-
        =If(IsBlank(locRin), UpdateContext({locRin: "Da contattare", locIdx: "Tutti"}));
        UpdateContext({locConfInv: false});
        ClearCollect(colListino, Filter(AddColumns('Voci listino', AnnoEd, ThisRecord.Edizione.Anno), AnnoEd = gblAnno));
        ClearCollect(colRinnBase, ForAll(Filter(colContratti, AnnoEd = Text(Value(gblAnno) - 1, "0") && StatoTxt <> "annullato") As c,
            {IdEsp: c.IdEsp, RagSoc: c.RagSoc, StandPrec: c.CodStand, ImpPrec: c.Imponibile, ScoPrec: c.Sconto,
             Fedele: !IsBlank(LookUp(colContratti, IdEsp = c.IdEsp && AnnoEd = Text(Value(gblAnno) - 2, "0") && StatoTxt <> "annullato")),
