                          Patch('Righe contratto', Defaults('Righe contratto'), {Contratto: gblNuovo, Riga: 1, 'Codice voce': "SPAZIO", Descrizione: "Area espositiva " & locStand.'Codice stand', Quantità: locStand.'Metri quadri', 'Prezzo unitario': locPrezzoMq, Importo: Round((locStand.'Metri quadri' * locPrezzoMq), 2)});
                          If(locPct > 0, Patch('Righe contratto', Defaults('Righe contratto'), {Contratto: gblNuovo, Riga: 2, 'Codice voce': "MAGG", Descrizione: "Maggiorazione " & locStand.PosTxt, Quantità: 1, 'Prezzo unitario': Round((locStand.'Metri quadri' * locPrezzoMq) * locPct, 2), Importo: Round((locStand.'Metri quadri' * locPrezzoMq) * locPct, 2)}));
                          ForAll(Filter(colExtra, Qta > 0) As ex, Patch('Righe contratto', Defaults('Righe contratto'), {Contratto: gblNuovo, Riga: If(locPct > 0, 2, 1) + CountRows(Filter(colExtra, Qta > 0 && Ord <= ex.Ord)), 'Codice voce': ex.Codice, Descrizione: ex.Descrizione, Quantità: ex.Qta, 'Prezzo unitario': ex.'Prezzo unitario', Importo: Round(ex.Qta * ex.'Prezzo unitario', 2)}));
                          ClearCollect(colContratti, AddColumns(Contratti,
                  AnnoEd, ThisRecord.Edizione.Anno,
                  CodStand, ThisRecord.Stand.'Codice stand',
                  IdEsp, ThisRecord.Espositore.'ID espositore',
                  RagSoc, ThisRecord.Espositore.'Ragione sociale',
                  StatoTxt, Text(ThisRecord.'Stato (g5_stato)')));
              ClearCollect(colStand, AddColumns(Stand,
                  CodPad, ThisRecord.Padiglione.Codice,
                  AnnoAtt, Value(ThisRecord.'Attivo dal'.Anno),
                  PosTxt, Text(ThisRecord.Posizione)));
                          Notify("Preventivo " & idNuovo & " creato", NotificationType.Success);
                          UpdateContext({locSalva: false});
                          Clear(colRighe);
                          Navigate(scrContratti, ScreenTransition.None, {locStato: "Tutti", locConf: false})
                      )
                  ),
                  UpdateContext({locSalva: false});
                  Notify("Salvataggio non riuscito: " & FirstError.Message, NotificationType.Error)
              )
            Fill: =nfVerde
            Color: =Color.White
            HoverFill: |-
              =ColorFade(nfVerde, -10%)
            PressedFill: |-
              =ColorFade(nfVerde, -20%)
            HoverColor: =Color.White
            BorderThickness: =0
            Font: =nfFont
            Size: =12
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            DisabledFill: =nfBordo
            DisabledColor: =nfTestoSec
            DisplayMode: |-
              =If(locSalva, DisplayMode.Disabled, DisplayMode.Edit)
            Visible: =locPasso = 4
