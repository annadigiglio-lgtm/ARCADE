spring.application.name=arcade-api
debug=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
spring.mvc.log-request-details=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=arcade&sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '20s'
server.error.include-message=never
server.error.include-stacktrace=never
arcade.jwt.secret=${ARCADE_JWT_SECRET}
arcade.demo.istante=${ARCADE_DEMO_ISTANTE:2025-12-20T11:55:00+01:00}
